name: sample-prod

services:
  postgres:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    env_file:
      - ./env/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [app]

  migrator:
    image: ${MIGRATOR_IMAGE}:${MIGRATOR_TAG:-latest}
    env_file:
      - ./env/.env.db
    command: ["sh", "-ec", "echo 'migration complete'"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [app]

  api:
    image: ${API_IMAGE}:${API_TAG:-latest}
    env_file:
      - ./env/.env.api
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [app]

  front:
    image: ${FRONT_IMAGE}:${FRONT_TAG:-latest}
    env_file:
      - ./env/.env.front
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [app]

  nginx:
    image: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:1.25-alpine}
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [app]

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
