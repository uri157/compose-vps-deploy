name: Backend Build Push And Dispatch (Template)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "value=${owner_lc}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve names and tags
        id: meta
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          API_IMAGE_NAME: ${{ vars.API_IMAGE_NAME }}
          MIGRATOR_IMAGE_NAME: ${{ vars.MIGRATOR_IMAGE_NAME }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY:-ghcr.io}"
          namespace="${IMAGE_NAMESPACE:-${{ steps.owner.outputs.value }}}"
          api_name="${API_IMAGE_NAME:-sample-api}"
          migrator_name="${MIGRATOR_IMAGE_NAME:-sample-migrator}"
          sha_tag="sha-${GITHUB_SHA}"

          echo "api_image=${registry}/${namespace}/${api_name}" >> "$GITHUB_OUTPUT"
          echo "migrator_image=${registry}/${namespace}/${migrator_name}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ vars.API_DOCKERFILE || './Dockerfile' }}
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.api_image }}:latest

      - name: Build and push migrator image
        if: ${{ vars.MIGRATOR_DOCKERFILE != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ vars.MIGRATOR_DOCKERFILE }}
          push: true
          tags: |
            ${{ steps.meta.outputs.migrator_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.migrator_image }}:latest

      - name: Dispatch infrastructure deploy
        env:
          INFRA_OWNER: ${{ vars.INFRA_OWNER }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          INFRA_WORKFLOW: ${{ vars.INFRA_WORKFLOW }}
          INFRA_REF: ${{ vars.INFRA_REF }}
          MIGRATOR_DOCKERFILE: ${{ vars.MIGRATOR_DOCKERFILE }}
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          API_TAG: ${{ steps.meta.outputs.sha_tag }}
          MIGRATOR_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          : "${INFRA_OWNER:?Missing vars.INFRA_OWNER}"
          : "${INFRA_REPO:?Missing vars.INFRA_REPO}"
          : "${INFRA_WORKFLOW:?Missing vars.INFRA_WORKFLOW}"
          : "${INFRA_REF:?Missing vars.INFRA_REF}"
          : "${INFRA_DISPATCH_TOKEN:?Missing secrets.INFRA_DISPATCH_TOKEN}"

          migrator_input=""
          if [ -n "${MIGRATOR_DOCKERFILE:-}" ]; then
            migrator_input="$(printf ',\"migrator_tag\":\"%s\"' "$MIGRATOR_TAG")"
          fi

          payload="$(printf '{"ref":"%s","inputs":{"api_tag":"%s"%s}}' \
            "$INFRA_REF" "$API_TAG" "$migrator_input")"

          CODE="$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_OWNER}/${INFRA_REPO}/actions/workflows/${INFRA_WORKFLOW}/dispatches" \
            -d "$payload")"

          cat response.txt || true
          test "$CODE" = "204"
