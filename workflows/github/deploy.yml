name: Deploy Compose Stack (Template)

on:
  workflow_dispatch:
    inputs:
      api_tag:
        description: API image tag override
        required: false
        default: ""
        type: string
      migrator_tag:
        description: Migrator image tag override
        required: false
        default: ""
        type: string
      front_tag:
        description: Frontend image tag override
        required: false
        default: ""
        type: string
      dry_run:
        description: Run deploy in dry-run mode
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add host to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy engine
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}

          REMOTE_REPO_PATH: ${{ vars.REMOTE_REPO_PATH }}
          REMOTE_CONFIG_PATH: ${{ vars.REMOTE_CONFIG_PATH }}

          API_TAG: ${{ inputs.api_tag }}
          MIGRATOR_TAG: ${{ inputs.migrator_tag }}
          FRONT_TAG: ${{ inputs.front_tag }}
          DRY_RUN: ${{ inputs.dry_run }}

          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          PROJECT_ENV_B64: ${{ secrets.PROJECT_ENV_B64 }}
          DB_ENV_B64: ${{ secrets.DB_ENV_B64 }}
          API_ENV_B64: ${{ secrets.API_ENV_B64 }}
          FRONT_ENV_B64: ${{ secrets.FRONT_ENV_B64 }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          set -euo pipefail

          : "${REMOTE_REPO_PATH:?Missing vars.REMOTE_REPO_PATH}"
          REMOTE_CONFIG_PATH="${REMOTE_CONFIG_PATH:-config/project.env}"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "REMOTE_REPO_PATH='$REMOTE_REPO_PATH' REMOTE_CONFIG_PATH='$REMOTE_CONFIG_PATH' \
             API_TAG='$API_TAG' MIGRATOR_TAG='$MIGRATOR_TAG' FRONT_TAG='$FRONT_TAG' \
             REGISTRY_USERNAME='$REGISTRY_USERNAME' REGISTRY_PASSWORD='$REGISTRY_PASSWORD' \
             PROJECT_ENV_B64='$PROJECT_ENV_B64' \
             DB_ENV_B64='$DB_ENV_B64' API_ENV_B64='$API_ENV_B64' FRONT_ENV_B64='$FRONT_ENV_B64' TUNNEL_TOKEN='$TUNNEL_TOKEN' \
             DRY_RUN='$DRY_RUN' bash -s" <<'EOF_REMOTE'
          set -euo pipefail

          cd "$REMOTE_REPO_PATH"
          git pull --ff-only

          export API_TAG MIGRATOR_TAG FRONT_TAG
          export REGISTRY_USERNAME REGISTRY_PASSWORD
          export PROJECT_ENV_B64
          export DB_ENV_B64 API_ENV_B64 FRONT_ENV_B64 TUNNEL_TOKEN

          DRY_FLAG=""
          if [ "${DRY_RUN:-false}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          bash scripts/deploy.sh --config "$REMOTE_CONFIG_PATH" $DRY_FLAG
          EOF_REMOTE
